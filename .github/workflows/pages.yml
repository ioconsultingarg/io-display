# Publica la demo estática en GitHub Pages: https://ioconsultingarg.github.io/io-display/
# Se vuelve a armar cada 30 minutos para que las noticias estén al día.
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Armar el sitio
        run: npm run sitio
        env:
          BASE: /${{ github.event.repository.name }}/
          TZ: America/Argentina/Buenos_Aires
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
